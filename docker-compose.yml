services:
  broker:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  simulador:
    build: .
    working_dir: /app/simulador
    command: python -u simulador.py
    environment:
      BROKER_HOST: broker
      TEMPO_POR_ANDAR: "1.5"
    depends_on: [broker]

  gateway:
    build: .
    working_dir: /app/gateway
    command: uvicorn app:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      BROKER_HOST: broker
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      TRADUTOR: ${TRADUTOR:-auto}
    depends_on: [broker]
