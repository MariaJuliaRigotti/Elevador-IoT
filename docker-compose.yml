services:
  simulador:
    build: .
    working_dir: /app/simulador
    command: python -u simulador.py
    environment:
      BROKER_HOST: broker.hivemq.com
      TEMPO_POR_ANDAR: "1.5"

  gateway:
    build: .
    working_dir: /app/gateway
    command: uvicorn app:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      BROKER_HOST: broker.hivemq.com
      POLITICA_FILA: ${POLITICA_FILA:-fifo}   # fifo (ordem de chegada) | curtas (respostas menores primeiro)
      LIMITE_NO: "2"                  # Pedidos simultaneos no no Ollama (igual ao OLLAMA_NUM_PARALLEL)
      TRADUTOR: ollama
      OLLAMA_URL: http://ollama:11434
      MODELO_COMANDO: qwen2.5:1.5b    # domínio comando (JSON curto)
      MODELO_CONSULTA: qwen2.5:3b     # domínio consulta (resposta em streaming)
    depends_on: [ollama]

  ollama:
    image: ollama/ollama
    environment:
      OLLAMA_KEEP_ALIVE: "-1"     # nunca tira o modelo da memória
      OLLAMA_NUM_PARALLEL: "2"
    volumes:
      - ollama:/root/.ollama      # guarda o modelo baixado entre execuções

volumes:
  ollama: